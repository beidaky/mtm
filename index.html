<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暗挖施工测量：锁口圈 · 竖井横通道 · 马头门</title>
<style>
/* 固定的蓝图配色：这是一页录屏用的竖屏动画，所有主题下都保持深蓝底 */
:root{
  --bg:#0b2545; --panel:#12315a; --line:#8ecbff; --hi:#ff9f43;
  --ink:#f2f8ff; --dim:#3d6a9e; --dimt:#9fbfe0; --ok:#7ee2b8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;margin:0;background:#0b2545;color:var(--ink);
  display:flex;justify-content:center;align-items:stretch;overflow:hidden;
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}

.stage{
  position:relative;height:100%;
  width:min(100%,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 9 / 16));
  container-type:inline-size;
  display:flex;flex-direction:column;background:var(--bg);overflow:hidden;
}
.prog{position:relative;z-index:3;display:flex;gap:1cqw;padding:3cqw 4cqw 0}
.prog span{flex:1;height:.9cqw;border-radius:1cqw;background:rgba(142,203,255,.2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--hi)}
.hd{position:relative;z-index:3;display:flex;align-items:center;gap:3cqw;padding:3.5cqw 5cqw 0;min-height:12cqw;transition:opacity .4s}
.hd.off{opacity:0}
.chip{border:.35cqw solid var(--hi);color:var(--hi);border-radius:5cqw;padding:.6cqw 2.6cqw;font-size:3.6cqw;font-weight:700;font-variant-numeric:tabular-nums}
.ttl{font-size:5.8cqw;font-weight:800;letter-spacing:.2cqw}

/* 跨场景连续空间衔接视口（固定不晃动，仅在切场景时做空间推拉衔接） */
.view{position:relative;flex:1;min-height:0;overflow:hidden}
.scene{
  position:absolute;inset:0;opacity:0;pointer-events:none;
  transform:translate3d(0,0,0) scale(1);
  transition:
    opacity .75s cubic-bezier(.22,1,.36,1),
    transform .85s cubic-bezier(.22,1,.36,1);
}
.scene.active{opacity:1;transform:translate3d(0,0,0) scale(1)}

/* 场景间的空间拓扑衔接方向：
   sc0 -> sc1: 从概览俯冲聚焦到地面控制网
   sc1 -> sc2: 从地面锁口圈垂直向下钻入竖井地底
   sc2 -> sc3: 从竖井向右侧平移展开横通道
   sc3 -> sc4: 从横通道推进聚焦到马头门掌子面洞口墙
   sc4 -> sc5: 从洞内拉远回到全局小结 */
.scene[data-pos="prev-0"]{transform:scale(1.22)}
.scene[data-pos="next-1"]{transform:scale(.82)}

.scene[data-pos="prev-1"]{transform:translate3d(0,-58%,0) scale(.92)}
.scene[data-pos="next-2"]{transform:translate3d(0,58%,0) scale(.95)}

.scene[data-pos="prev-2"]{transform:translate3d(-42%,0,0) scale(.94)}
.scene[data-pos="next-3"]{transform:translate3d(42%,0,0) scale(.94)}

.scene[data-pos="prev-3"]{transform:translate3d(-30%,8%,0) scale(1.28)}
.scene[data-pos="next-4"]{transform:translate3d(25%,-6%,0) scale(.78)}

.scene[data-pos="prev-4"]{transform:scale(.84)}
.scene[data-pos="next-5"]{transform:translate3d(0,25%,0) scale(.95)}

.scene svg{width:100%;height:100%;display:block}

.cap{
  position:relative;z-index:3;
  min-height:26cqw;padding:2cqw 6cqw 3cqw;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:5.4cqw;line-height:1.55;font-weight:600;
}
.cap > span{display:block;text-wrap:balance}
.sub{text-wrap:balance}
.cap b{color:var(--hi);font-weight:800}
.cap.in{animation:capin .4s ease-out}
@keyframes capin{from{opacity:0;transform:translateY(1.5cqw)}to{opacity:1;transform:none}}

.controls{position:relative;z-index:3;display:flex;justify-content:center;align-items:center;gap:4.5cqw;padding:1cqw 0 4cqw;transition:opacity .4s}
.stage.hideui .controls{opacity:0;pointer-events:none}
.controls button{width:12cqw;height:12cqw;border-radius:50%;border:.4cqw solid var(--dim);background:var(--panel);font-size:4.6cqw;line-height:1}

/* 开场 / 倒计时 / 结束 */
.ov{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;padding:8cqw;text-align:center;background:rgba(7,22,42,.94)}
.ov.show{display:flex}
.ov h2{margin:0;font-size:8cqw;font-weight:800}
.ov p{margin:0;font-size:4.2cqw;line-height:1.7;color:var(--dimt)}
.ov .go{margin-top:3cqw;border:0;border-radius:8cqw;padding:3.6cqw 9cqw;background:var(--hi);color:#1a1205;font-size:5.4cqw;font-weight:800}
.ov .num{font-size:34cqw;font-weight:800;color:var(--hi);line-height:1;font-variant-numeric:tabular-nums}

/* 动画基础件 */
.fade{opacity:0;transition:opacity .6s ease}
.fade.on{opacity:1}
.pop-up{opacity:0;transform-box:fill-box;transform-origin:bottom center;transform:translateY(8px) scale(.85);transition:opacity .45s ease,transform .5s cubic-bezier(.34,1.56,.64,1)}
.pop-up.on{opacity:1;transform:none}
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset var(--d,1s) ease-in-out}
.draw.on{stroke-dashoffset:0}
.grow-y,.grow-x{transform-box:fill-box;transition:transform var(--d,2s) ease-in-out}
.grow-y{transform-origin:top;transform:scaleY(0)}
.grow-y.on{transform:scaleY(1)}
.grow-x{transform-origin:left;transform:scaleX(0)}
.grow-x.on{transform:scaleX(1)}
.rise{opacity:0;transform:translateY(2cqw);transition:opacity .6s ease,transform .6s ease}
.rise.on{opacity:1;transform:none}
.ping{transform-box:fill-box;transform-origin:center;opacity:0}
.ping.on{animation:ping 1.5s ease-out 3}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
.reset *{transition:none!important;animation:none!important}

/* 2.5D / 3D 线条与立体面样式 */
.l{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.c-hi{stroke:var(--hi)} .c-ink{stroke:var(--ink)} .c-dim{stroke:var(--dim)} .c-ok{stroke:var(--ok)}
.w2{stroke-width:2.5} .w3{stroke-width:3.2} .thin{stroke-width:1}
.dash{stroke-dasharray:4 4}
.face-top{fill:rgba(255,159,67,.18);stroke:var(--hi);stroke-width:2;stroke-linejoin:round}
.face-side{fill:rgba(255,159,67,.32);stroke:var(--hi);stroke-width:1.6;stroke-linejoin:round}
.face-dark{fill:rgba(7,20,38,.88);stroke:var(--dim);stroke-width:1.2;stroke-linejoin:round}
.face-wall{fill:rgba(18,54,96,.65);stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}
.face-floor{fill:rgba(14,42,76,.92);stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}
.plane-xy{fill:rgba(255,159,67,.12);stroke:var(--hi);stroke-width:1.2;stroke-dasharray:3 3}

.t{fill:var(--ink);font-size:13px;font-weight:600;stroke:var(--bg);stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.t.sm{font-size:11.5px}
.t.big{font-size:19px;font-weight:800}
.t-hi{fill:var(--hi)} .t-dim{fill:var(--dimt)} .t-ok{fill:var(--ok)}

/* 开场页与小结页（HTML 场景） */
.scene.html{display:flex;flex-direction:column;justify-content:center;gap:3.5cqw;padding:0 8cqw}
.scene .deco{position:relative;right:auto;top:auto;flex:none;align-self:center;width:min(46cqw,24dvh);height:min(46cqw,24dvh);opacity:.95}
.kicker{margin:0;font-size:4.4cqw;color:var(--dimt);font-weight:600}
.big-t{margin:0;display:flex;flex-direction:column;gap:1.5cqw;font-size:13cqw;line-height:1.1;font-weight:800;letter-spacing:.4cqw}
.big-t .a{color:var(--hi)} .big-t .b{color:var(--line)} .big-t .c{color:var(--ink)}
.sub{margin:0;font-size:4.6cqw;color:var(--dimt)}
.sum h2{margin:0 0 1cqw;font-size:8cqw;font-weight:800}
.card{display:flex;gap:4cqw;align-items:flex-start;padding:4cqw;background:var(--panel);border-left:1.2cqw solid var(--hi);border-radius:1.5cqw}
.card em{font-style:normal;font-size:8cqw;font-weight:800;color:var(--hi);line-height:1;font-variant-numeric:tabular-nums}
.card b{display:block;font-size:5.8cqw;font-weight:800;margin-bottom:1cqw}
.card span{display:block;font-size:4cqw;line-height:1.55;color:var(--dimt)}
.src{margin:1cqw 0 0;font-size:3.4cqw;color:var(--dimt);line-height:1.6}
</style>
</head>
<body>

<!-- 共用图案 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="soil" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
    <rect width="14" height="14" fill="#0d2b4e"/>
    <path d="M0 7H14" stroke="#265080" stroke-width="1"/>
    <circle cx="4" cy="3" r=".9" fill="#2d5a8c"/>
  </pattern>
  <pattern id="wall" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="skewY(-12)">
    <rect width="16" height="16" fill="#11355e"/>
    <path d="M0 16L16 0M0 8H16" stroke="#2b5788" stroke-width=".9"/>
  </pattern>
  <pattern id="tape" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ff9f43" opacity=".32"/>
    <path d="M0 1H8M0 5H5" stroke="#ff9f43" stroke-width="1.3"/>
  </pattern>
  <linearGradient id="shaftGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#07182e"/>
    <stop offset="55%" stop-color="#0d2a4d"/>
    <stop offset="100%" stop-color="#061529"/>
  </linearGradient>
  <linearGradient id="tunnelGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#051326"/>
    <stop offset="65%" stop-color="#0c2748"/>
    <stop offset="100%" stop-color="#133863"/>
  </linearGradient>
</defs></svg>

<main class="stage" id="stage">
  <div class="prog" id="prog"></div>
  <div class="hd off" id="hd"><span class="chip" id="chip"></span><span class="ttl" id="ttl"></span></div>

  <div class="view" id="view">

    <!-- 0 开场：2.5D 轴测立体线框徽标 -->
    <section class="scene html" id="sc0">
      <svg class="deco" viewBox="0 0 220 220" aria-hidden="true">
        <!-- 2.5D 轴测井口圈梁 + 竖井立体线框预览 -->
        <polygon class="l c-dim draw" style="--d:1.8s" pathLength="1" data-t="0.1" data-sfx="chalk" points="110,28 186,66 110,104 34,66"/>
        <polygon class="l c-hi draw" style="--d:1.6s" pathLength="1" data-t="0.25" points="110,44 162,70 110,96 58,70"/>
        <path class="l c-dim draw" style="--d:1.5s" pathLength="1" data-t="0.35" d="M58 70V156L110 184L162 156V70"/>
        <path class="l c-hi dash draw" style="--d:1.4s" pathLength="1" data-t="0.45" d="M110 20V196M26 66L194 66"/>
      </svg>
      <p class="kicker rise" data-t="0.3" data-sfx="wood_low" >城市轨道交通 · 暗挖施工测量</p>
      <h1 class="big-t">
        <span class="a rise" data-t="0.7" data-sfx="title_1">锁口圈</span>
        <span class="b rise" data-t="1.2" data-sfx="title_2">竖井横通道</span>
        <span class="c rise" data-t="1.7" data-sfx="title_3">马头门</span>
      </h1>
      <p class="sub rise" data-t="2.6" data-sfx="intro_chord">知识分享：从地面到洞内，怎么一步步放样</p>
    </section>

    <!-- 1 锁口圈定位（2.5D 轴测地面网格 + 3D 全站仪三脚架 + 3D 立体锁口圈梁） -->
    <section class="scene" id="sc1">
      <svg viewBox="0 0 360 420" preserveAspectRatio="xMidYMid meet">
        <!-- 2.5D 轴测透视地面网格 -->
        <g opacity=".55">
          <path class="l c-dim thin" d="M-20 130L380 70M-20 175L380 115M-20 220L380 160M-20 265L380 205M-20 310L380 250M-20 355L380 295M-20 400L380 340"/>
          <path class="l c-dim thin" d="M20 70L170 410M75 65L225 410M130 60L280 410M185 55L335 410M240 50L390 410M-35 80L115 410"/>
        </g>

        <g class="fade" data-t="1.0" data-sfx="wood_tag">
          <rect x="16" y="14" width="176" height="26" rx="13" fill="#12315a" stroke="#3d6a9e"/>
          <text class="t sm" x="104" y="31" text-anchor="middle">依据：加密导线测量成果</text>
        </g>

        <!-- 2.5D 地面控制点桩位 GTD31 & GTD30 -->
        <g class="fade" data-t="0.4" data-sfx="stake_init">
          <!-- GTD31 立体控制点标石 -->
          <ellipse class="l c-hi" cx="296" cy="96" rx="11" ry="5.5"/>
          <ellipse cx="296" cy="96" rx="3.5" ry="1.8" fill="#ff9f43"/>
          <path class="l c-hi thin" d="M296 96V78"/>
          <polygon points="296,75 304,79 296,83" fill="#ff9f43"/>
          <text class="t" x="296" y="68" text-anchor="middle">GTD31</text>

          <!-- GTD30 地面基准盘 -->
          <ellipse class="l c-hi" cx="212" cy="162" rx="12" ry="6"/>
          <ellipse cx="212" cy="162" rx="3.5" ry="1.8" fill="#ff9f43"/>
          <text class="t" x="212" y="110" text-anchor="middle">GTD30</text>
        </g>

        <!-- 2.5D 地面后视方向连线与棱镜立杆 -->
        <path class="l dash fade" data-t="1.6" data-sfx="sight_back" d="M212 132L296 82"/>
        <text class="t sm t-dim fade" data-t="1.8" x="268" y="122">后视方向</text>

        <!-- 3D 全站仪 + 三脚架立体模型 -->
        <g class="pop-up" data-t="2.4" data-sfx="tripod_set">
          <ellipse class="l c-hi ping" data-t="2.4" cx="212" cy="162" rx="10" ry="5"/>
          <!-- 三脚架三条立体支腿 -->
          <path class="l c-ink w2" d="M212 136L198 163M212 136L226 163M212 136L212 166"/>
          <!-- 仪器基座与望远镜机身 -->
          <rect x="205" y="124" width="14" height="11" rx="2" fill="#ff9f43" stroke="#f2f8ff" stroke-width="1.2"/>
          <circle cx="212" cy="129.5" r="3" fill="#0b2545" stroke="#f2f8ff" stroke-width="1"/>
          <text class="t sm t-dim" x="232" y="156">全站仪设站</text>
        </g>

        <!-- 从 3D 全站仪镜头 (212,130) 向下投射到 2.5D 地面四个角点的空间视线 -->
        <path class="l c-hi thin draw" style="--d:.75s" pathLength="1" data-t="4.0" data-sfx="laser_1" d="M212 130L74 256"/>
        <path class="l c-hi thin draw" style="--d:.75s" pathLength="1" data-t="4.5" data-sfx="laser_2" d="M212 130L198 236"/>
        <path class="l c-hi thin draw" style="--d:.75s" pathLength="1" data-t="5.0" data-sfx="laser_3" d="M212 130L246 312"/>
        <path class="l c-hi thin draw" style="--d:.75s" pathLength="1" data-t="5.5" data-sfx="laser_4" d="M212 130L122 332"/>

        <!-- 四个 2.5D 立体木桩角点（带地面透视椭圆环与立针） -->
        <g class="pop-up" data-t="4.6" data-sfx="stake_1">
          <ellipse cx="74" cy="256" rx="6" ry="3" fill="none" stroke="#ff9f43" stroke-width="1.4"/>
          <path class="l c-hi w2" d="M74 256V242"/><circle cx="74" cy="242" r="2.8" fill="#ff9f43"/>
        </g>
        <g class="pop-up" data-t="5.1" data-sfx="stake_2">
          <ellipse cx="198" cy="236" rx="6" ry="3" fill="none" stroke="#ff9f43" stroke-width="1.4"/>
          <path class="l c-hi w2" d="M198 236V222"/><circle cx="198" cy="222" r="2.8" fill="#ff9f43"/>
        </g>
        <g class="pop-up" data-t="5.6" data-sfx="stake_3">
          <ellipse cx="246" cy="312" rx="6" ry="3" fill="none" stroke="#ff9f43" stroke-width="1.4"/>
          <path class="l c-hi w2" d="M246 312V298"/><circle cx="246" cy="298" r="2.8" fill="#ff9f43"/>
        </g>
        <g class="pop-up" data-t="6.1" data-sfx="stake_4">
          <ellipse cx="122" cy="332" rx="6" ry="3" fill="none" stroke="#ff9f43" stroke-width="1.4"/>
          <path class="l c-hi w2" d="M122 332V318"/><circle cx="122" cy="318" r="2.8" fill="#ff9f43"/>
        </g>

        <!-- 2.5D / 3D 立体锁口圈梁（带顶面、内壁厚度、外侧立体高度） -->
        <!-- 外圈轴测轮廓 -->
        <path class="l c-hi w2 draw" style="--d:1.1s" pathLength="1" data-t="7.0" data-sfx="chalk_box" d="M74 256L198 236L246 312L122 332Z"/>
        <!-- 内圈轴测轮廓 -->
        <path class="l draw" style="--d:1.0s" pathLength="1" data-t="7.8" data-sfx="chalk_inner" d="M94 263L190 248L226 305L130 320Z"/>

        <!-- 3D 锁口圈立体拔高体块（展现 3D 混凝土圈梁厚度与竖井向下开口暗影） -->
        <g class="pop-up" data-t="8.2" data-sfx="beam_solid">
          <!-- 井口内部深色立体阴影与内侧后壁 -->
          <polygon points="94,263 190,248 226,305 130,320" fill="#061529" opacity=".88"/>
          <polygon points="94,263 190,248 190,268 94,283" fill="#163d6b" stroke="#8ecbff" stroke-width="1"/>
          <polygon points="190,248 226,305 226,325 190,268" fill="#0f2d52" stroke="#8ecbff" stroke-width="1"/>
          <!-- 3D 锁口圈梁顶面半透明填充 -->
          <path d="M74 256L198 236L246 312L122 332ZM94 263L130 320L226 305L190 248Z" fill="rgba(255,159,67,.22)" fill-rule="evenodd" stroke="#ff9f43" stroke-width="1.8"/>
          <!-- 3D 锁口圈梁外侧左前壁与右前壁（厚度 20px） -->
          <polygon class="face-side" points="74,256 122,332 122,352 74,276"/>
          <polygon class="face-top" points="122,332 246,312 246,332 122,352"/>
        </g>

        <g class="fade" data-t="8.5">
          <text class="t big" x="160" y="288" text-anchor="middle">锁口圈</text>
          <text class="t sm t-dim" x="168" y="372" text-anchor="middle">按图纸放样（立体圈梁）</text>
        </g>

        <!-- 2.5D 透视指北针 -->
        <g class="fade" data-t="0.4">
          <ellipse class="l c-dim thin" cx="322" cy="388" rx="16" ry="8"/>
          <path class="l c-hi" d="M322 396V366M322 366l-5 10M322 366l5 10"/>
          <text class="t sm" x="322" y="412" text-anchor="middle">N</text>
        </g>
      </svg>
    </section>

    <!-- 2 竖井施工测量（承接顶部 2.5D 锁口圈 + 3D 剖切竖井井筒 + 立体垂球吊线 & 3D 吊钢尺） -->
    <section class="scene" id="sc2">
      <svg viewBox="0 0 360 420" preserveAspectRatio="xMidYMid meet">
        <!-- 地层剖面与 2.5D 地表顶面 -->
        <rect x="0" y="92" width="360" height="328" fill="url(#soil)"/>
        <polygon points="0,92 55,66 360,66 360,92" fill="#10315a" opacity=".7"/>
        <path class="l c-dim" d="M0 92H360"/>

        <!-- 3D 竖井立体井筒向下开挖（带左后壁、右后壁、3D 井底平面与分层初期支护环） -->
        <g class="grow-y" style="--d:3s" data-t="0.6" data-sfx="shaft_dig">
          <!-- 3D 井筒内部左后壁与右后壁 -->
          <polygon points="96,92 162,74 162,364 96,390" fill="#0d2c52" stroke="#3d6a9e" stroke-width="1.2"/>
          <polygon points="162,74 264,92 264,390 162,364" fill="#081d38" stroke="#3d6a9e" stroke-width="1.2"/>
          <!-- 井壁 2.5D 格栅拱架横肋线（体现 3D 纵深） -->

    }
    var caps=S[idx].caps;
    while(capIdx+1<caps.length&&caps[capIdx+1][0]<=t){capIdx++;showCap(caps[capIdx][1]);}
    updateProg();
    if(t>=S[idx].dur){
      if(idx<S.length-1){enter(idx+1);}
      else{finish();return;}
    }
    raf=requestAnimationFrame(frame);
  }

  function play(){
    if(playing)return;
    initAudio();
    playing=true;bPlay.textContent='⏸';last=performance.now();
    raf=requestAnimationFrame(frame);
  }
  function pause(){playing=false;bPlay.textContent='▶';cancelAnimationFrame(raf);}
  function finish(){
    playing=false;cancelAnimationFrame(raf);bPlay.textContent='▶';
    stage.classList.remove('hideui');
    document.getElementById('ovEnd').classList.add('show');
  }

  function stop(e){e.stopPropagation();}
  ['bPrev','bPlay','bNext','bMute'].forEach(function(id){document.getElementById(id).addEventListener('click',stop);});
  document.getElementById('bPrev').addEventListener('click',function(){initAudio();enter(idx-1);play();});
  document.getElementById('bNext').addEventListener('click',function(){initAudio();enter(idx+1);play();});
  bPlay.addEventListener('click',function(){playing?pause():play();});
  bMute.addEventListener('click',function(){
    muted = !muted;
    bMute.textContent = muted ? '🔇' : '🔊';
  });

  stage.addEventListener('click',function(e){
    if(e.target.closest('.ov'))return;
    stage.classList.toggle('hideui');
  });

  var ovStart=document.getElementById('ovStart'),ovCount=document.getElementById('ovCount'),ovEnd=document.getElementById('ovEnd');
  var num=document.getElementById('num');

  document.getElementById('goBtn').addEventListener('click',function(e){
    e.stopPropagation();
    initAudio();
    playSFX('wood_low');
    ovStart.classList.remove('show');

    // 以下为原来的倒计时代码，已变灰注释
    // ovCount.classList.add('show');
    // var n=3;num.textContent=n;
    // var iv=setInterval(function(){
    //   n--;
    //   if(n>0){num.textContent=n;}
    //   else{clearInterval(iv);ovCount.classList.remove('show');stage.classList.add('hideui');enter(0);play();}
    // },1000);

    // 删掉倒计时后，直接执行播放逻辑
    stage.classList.add('hideui');
    enter(0);
    play();
  });

  document.getElementById('replayBtn').addEventListener('click',function(e){
    e.stopPropagation();
    initAudio();
    playSFX('wood_low');
    ovEnd.classList.remove('show');stage.classList.add('hideui');enter(0);play();
  });

  enter(0);
  if(location.hash==='#sfxtest'){window.__sfx={play:playSFX,init:function(){actx=null;initAudio();},ctx:function(){return actx;}};}
})();
</script>
